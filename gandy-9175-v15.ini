; Version 15 of the Gandy replica: version 14 with the motor's own turning
; kept. Thirteen runs of 40 loops; during each the table creeps 6
; degrees as the motor drives it, so a run's loops fan a little as the
; photo's do, and between runs it is turned by hand the rest of the way to
; 27.7 degrees with the pen off the paper. A ring run of 5 held sizes
; comes first. Sampled in time, not arc length, so a hand jump stays a
; single long step for the pen lift to find.
; After James Nolan Gandy, "Drawing from Drawing Machine #9175":
; jamesnolangandy.com/drawings-for-sale-53/drawing-from-drawing-machine-9155
[pipeline]
modules = so, s0, sh, s3, tb, s2, s7, ti, s6

; where the pen rests: this far from the table's axis
[so]
type = translation
start_x = 45
end_x = 45
start_y = 0
end_y = 0
normalize = true

; the loop; its tilt nudged four times during the ring run (the table by hand)
[s0]
type = ellipse
anchor = end
center_x = 0
radius_x = 150
radius_y = 130
rotation = 15
switch_rotation = 0.0267 18.75, 0.0533 22.50, 0.0800 26.25, 0.1067 30.00
cycles = 600

; the pin's slot: the ring run's held sizes, relative to the swell's small end
[sh]
type = scale
scope = 1
start_scale = 0.400
end_scale = 0.400
switch_start_scale = 0.0267 0.733, 0.0533 1.167, 0.0800 1.667, 0.1067 2.167, 0.1333 1.0
origin_x = 0
origin_y = 0

[s3]
type = scale
scope = 1
start_scale = 1.0
end_scale = 0.5
osc_start_scale = 1,0,0.08
origin_x = 0
origin_y = 0

; the runs' clock: still through the ring run, then the thirteen runs
[tb]
type = tempo
mode = motor
on_at = 0.1333
creep = 0
spinup = 0

; one swell per run
[s2]
type = scale
scope = 1
start_scale = 0.3
end_scale = 1.0
osc_start_scale = 13,0
origin_x = 0
origin_y = 0

; the table under the motor: creeping 6 degrees in each run
[s7]
type = rotation
total_degrees = 78

; the table, turned by hand the rest of the way between runs
[ti]
type = tempo
mode = stutter
steps = 13
dwell = 1

[s6]
type = rotation
total_degrees = 282

[pen_lift]
mode = threshold
threshold = 40

[output]
width = 800
height = 800
stroke_width = 0.25
stroke_color = #000000
background_color = #ffffff
margin = 0.08
ink_flow = 0.5
filename = /dev/null

[sampling]
initial_samples = 150000
output_samples = 40000
use_arc_length = false
