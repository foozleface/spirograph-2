; Version 9 of the Gandy replica: version 8 with the hand phase held
; properly. Every nudged position of the table is held as long as the
; others, so the biggest ring of the stack -- the darkest in the original --
; gets its share of loops; and the swell starts a tenth of the way into its
; cycle, off the flat of its cosine, so the rings come out at evenly spaced
; sizes rather than two tiny ones and a jump. Rounder ovals (115 to 130)
; for the original's fat loops.
; After James Nolan Gandy, "Drawing from Drawing Machine #9175":
; jamesnolangandy.com/drawings-for-sale-53/drawing-from-drawing-machine-9155
[pipeline]
modules = s0, s1, s2, s3, s4, s5, s6

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 130
jitter_radius_x = 6,17
radius_y = 115
jitter_radius_y = 8,11
rotation = 25
end_rotation = 29
cycles = 525

[s1]
type = tempo
mode = motor
on_at = 0.2
creep = 0.06
nudges = 4
spinup = 0.03

[s2]
type = scale
start_scale = 0.3
end_scale = 1.0
osc_start_scale = 16.25,0,0.1
jitter_start_scale = 5,17
origin_x = 0
origin_y = 0

[s3]
type = scale
start_scale = 1.0
end_scale = 0.55
osc_start_scale = 1,0
origin_x = 0
origin_y = 0

[s4]
type = translation
start_x = 0
end_x = -15
start_y = 0
end_y = -12
normalize = true

[s5]
type = circle
radius = 12
cycles = 2

[s6]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 150000
output_samples = 40000
use_arc_length = true
