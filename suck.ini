[pipeline]
modules = s0, s1, s2, s3

[s0]
type = harmonograph
freq1 = 2.0
amp1 = 100.0
end_amp1 = 100.0
phase1 = 2.0
decay1 = 2.0
freq2 = 4.0
amp2 = 100.0
end_amp2 = 100.0
phase2 = 90.0
decay2 = 0.0
freq3 = 0.0
amp3 = 0.0
end_amp3 = 0.0
phase3 = 0.0
decay3 = 0.0
freq4 = 0.0
amp4 = 0.0
end_amp4 = 0.0
phase4 = 0.0
decay4 = 0.0
duration = 60.0
cycles = 1.0

[s1]
type = rail_slide
rail_length = 200.0
passes = 2
rail_angle = 0.0
cycles = 1.0
scale = 1.0

[s2]
type = spirograph_rail
rail_length = 200.0
gear_teeth = 40
tooth_pitch = 1.0
hole_position = 0.6
end_hole_position = 0.6
passes = 2
cycles = 1.0
rail_angle = 0.0
scale = 1.0

[s3]
type = arc
radius = 100.0
start_angle = 0.0
sweep_angle = 180.0
cycles = 1.0
center_x = 0.0
center_y = 0.0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 120000
output_samples = 16000
use_arc_length = true
