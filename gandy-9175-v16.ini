; Version 16 of the Gandy replica: version 15 with the ring run lighter.
; Ten loops a ring instead of sixteen, and the table creeping fifteen
; degrees under the motor through the ring run (a rotation whose rate is
; switched to nothing when the runs begin) instead of being nudged in
; four steps, so each ring is a soft fan rather than a black band. A finer
; line, weighted more by the pen's speed.
; The hand on the machine is written as events, not guessed from the
; line: a lift step turns the table between the thirteen runs with the
; pen up, and the pin's slot changes lift it too (lift_on_switch), so
; there is no threshold pen lift to find the jumps.
; After James Nolan Gandy, "Drawing from Drawing Machine #9175":
; jamesnolangandy.com/drawings-for-sale-53/drawing-from-drawing-machine-9155
[pipeline]
modules = so, s0, sh, s3, sr, tb, s2, s7, ti, s6

; where the pen rests: this far from the table's axis
[so]
type = translation
start_x = 45
end_x = 45
start_y = 0
end_y = 0
normalize = true

; the loop
[s0]
type = ellipse
anchor = end
center_x = 0
radius_x = 150
radius_y = 130
rotation = 30
cycles = 570

; the pin's slot: the ring run's five held sizes, relative to the swell's small end;
; the pen is up while the pin is moved
[sh]
type = scale
scope = 1
start_scale = 0.400
end_scale = 0.400
switch_start_scale = 0.0175 0.733, 0.0351 1.167, 0.0526 1.667, 0.0702 2.167, 0.0877 1.0
lift_on_switch = true
origin_x = 0
origin_y = 0

[s3]
type = scale
scope = 1
start_scale = 1.0
end_scale = 0.5
osc_start_scale = 1,0,0.08
origin_x = 0
origin_y = 0

; the table creeping fifteen degrees through the ring run, then still
[sr]
type = rotation
total_degrees = 171.00
switch_total_degrees = 0.0877 0

; the runs' clock: still through the ring run, then the thirteen runs
[tb]
type = tempo
mode = motor
on_at = 0.0877
creep = 0
spinup = 0

; one swell per run
[s2]
type = scale
scope = 1
start_scale = 0.3
end_scale = 1.0
osc_start_scale = 13,0
origin_x = 0
origin_y = 0

; the table under the motor: creeping 6 degrees in each run
[s7]
type = rotation
total_degrees = 78

; the pen up, the table turned by hand the rest of the way between runs, the pen down
[ti]
type = lift
steps = 13

[s6]
type = rotation
total_degrees = 282

[output]
width = 800
height = 800
stroke_width = 0.2
stroke_color = #000000
background_color = #ffffff
margin = 0.08
ink_flow = 0.6
filename = /dev/null

[sampling]
initial_samples = 150000
output_samples = 40000
use_arc_length = false
