; Version 7 of the Gandy replica, on a different arm: a Pintograph -- two
; cranks 420 and 403.75 turns, a rod on each, the pen 300 past the elbow on
; rod 1 -- over a table turning 1.25 times. The beat between the cranks swells
; the loops 13 times a turn: the petals, without any hand-set swelling. The
; axis sits at the pen's rest point; a small slide and slips rough it up.
[pipeline]
modules = s0, s1, s2

[s0]
type = pintograph
spacing = 200
radius_1 = 60
end_radius_1 = 60
jitter_radius_1 = 5,9
radius_2 = 60
end_radius_2 = 60
jitter_radius_2 = 5,7
turns_1 = 525
turns_2 = 508.75
phase_1 = 0
phase_2 = 90
arm_1 = 200
arm_2 = 200
pen_extend = 300
elbow = 1
cycles = 1

[s1]
type = translation
start_x = 0
end_x = -25
start_y = 0
end_y = -20
normalize = true
easing = ease_in

[s2]
type = rotation
total_degrees = 450
slip = 2
slip_wanders = 5
origin_x = 0
origin_y = 421

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
