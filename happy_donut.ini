[pipeline]
modules = s0, s1

[s0]
type = surface
surface = klein
major_radius = 91.14
minor_radius = 42.66
v_lines = 171
view_angle_x = 34.01
view_angle_y = 31.54

[s1]
type = rotation
total_degrees = 360
origin_x = 0
origin_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.1
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
scroll_repeats = 1
