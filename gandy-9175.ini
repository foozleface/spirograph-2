; After James Nolan Gandy, "Drawing from Drawing Machine #9175" (ink on paper,
; from his analog drawing machine) -- jamesnolangandy.com, @gandyworks.
; An oval pinned at its end, like a pen arm on a pivot, with the paper
; turning under it at 13.007 ovals a turn: each turn lands just beside the
; last, so the ovals bunch into 13 petal fans. The oval's length changes once
; a turn (lopsided) and its width slowly (filled petals); both slip a little
; at random, and so does the table -- the unevenness of a real machine.
[pipeline]
modules = s0, s1

[s0]
type = ellipse
anchor = end
center_x = -1
center_y = 0
radius_x = 78
end_radius_x = 112
osc_radius_x = 36,0
jitter_radius_x = 9,23
radius_y = 34
end_radius_y = 64
osc_radius_y = 2.5,0
jitter_radius_y = 12,9
cycles = 468.25

[s1]
type = rotation
loops_per_turn = 13.007
slip = 4
slip_wanders = 9
origin_x = 0
origin_y = 0

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
