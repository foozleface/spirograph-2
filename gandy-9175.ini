; After James Nolan Gandy, "Drawing from Drawing Machine #9175" (ink on paper,
; from his analog drawing machine) -- jamesnolangandy.com, @gandyworks.
; Not a few ovals bunched by a slow table: one oval per small step of a
; turning table, 420 of them in one turn, so they fan evenly all the way
; round. The oval is pinned at its end; its length, width and tilt swell and
; shrink 13 times a turn -- the 13 petals, each filled with the crossing mesh
; of its neighbours. A stretch over the whole turn makes the big petals one
; side and the small the other; the pivot wanders a little (the off-centre
; knot); and lengths, widths and the table all slip.
[pipeline]
modules = s0, s1, s2, s3

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 60
end_radius_x = 112
osc_radius_x = 13,0
jitter_radius_x = 9,17
radius_y = 42
end_radius_y = 70
osc_radius_y = 13,0
jitter_radius_y = 12,11
rotation = 0
end_rotation = 4
osc_rotation = 13,0
cycles = 420

[s1]
type = circle
radius = 6
end_radius = 6
cycles = 1

[s2]
type = stretch
scale_x = 0.66
end_scale_x = 1.0
osc_scale_x = 1,0
scale_y = 1
end_scale_y = 1
origin_x = -2
origin_y = 0

[s3]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
