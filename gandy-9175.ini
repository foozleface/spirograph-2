; After James Nolan Gandy, "Drawing from Drawing Machine #9175" (ink on paper,
; from his analog drawing machine) -- jamesnolangandy.com, @gandyworks.
; An oval traced by the arm; the paper turning under it 36 times at 13.007
; ovals a turn, so each turn lands just beside the last and the ovals bunch
; into 13 petal fans. The oval's length changes once a turn (lopsided) and
; its width slowly (filled petals), both about a point near its tip, which
; passes over the turntable's axis -- the dense eye in the middle.
[pipeline]
modules = s0, s1, s2

[s0]
type = ellipse
radius_x = 100
end_radius_x = 100
radius_y = 42
end_radius_y = 42
lobe = 0
lobe_n = 1
cycles = 468.25

[s1]
type = stretch
scale_x = 0.75
end_scale_x = 1.1
osc_scale_x = 36,0
scale_y = 0.65
end_scale_y = 1.35
osc_scale_y = 2.5,0
origin_x = -70
origin_y = 0

[s2]
type = rotation
total_degrees = 12960
origin_x = -97
origin_y = 0

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
