; five-point web: an ellipse rider, 60 and a quarter loops a trip, four trips
[pipeline]
modules = rider, carrier

[rider]
type = spirograph_gear
fixed_teeth = 72
rolling_teeth = 48
hole_position = 0.8
cycles = 241

[carrier]
type = ring_carrier
fixed_teeth = 180
rolling_teeth = 144
bore_offset = 6
cycles = 4

[sampling]
initial_samples = 800000
output_samples = 120000

[output]
stroke_width = 0.15
stroke_color = #202020
