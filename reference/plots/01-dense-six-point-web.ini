; six-point web: a 150-tooth carrier, 90 and a third loops a trip, three trips
[pipeline]
modules = rider, carrier

[rider]
type = spirograph_gear
fixed_teeth = 60
rolling_teeth = 40
hole_position = 0.9
cycles = 271

[carrier]
type = ring_carrier
fixed_teeth = 180
rolling_teeth = 150
bore_offset = 8
cycles = 3

[sampling]
initial_samples = 800000
output_samples = 120000

[output]
stroke_width = 0.15
stroke_color = #202020
