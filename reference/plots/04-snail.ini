; Sample 04, reference/04-spiral-of-loops-yellow-blue.png: the snail.
; A loop walked out along a spiral of a turn and a half, growing as it
; goes, each loop turned to lie along the spiral. The pen was swapped as
; it went: yellow, blue, yellow, blue, yellow, the machine nudged on a
; way with the pen up at each swap, so each colour starts clear of the last.
[pipeline]
modules = loop, snail

; the loop: an oval, its long side along the track, growing with radius
[loop]
type = ellipse
radius_x = 14
end_radius_x = 46
radius_y = 9
end_radius_y = 30
rotation = 0
cycles = 150

; the track: out along a spiral, a turn and a half, turning the loop with it
[snail]
type = spiral_arc
inner_radius = 12
outer_radius = 150
start_angle = 0
sweep_angle = 540
cycles = 1
follow = true
normalize = true

[sampling]
initial_samples = 600000
output_samples = 90000

[output]
width = 800
height = 800
stroke_width = 0.22
stroke_color = #e8d44d
background_color = #1c1c1c
inks = #e8d44d, #2f7fd6, #e8d44d, #2f7fd6, #e8d44d
ink_changes = 0.18-0.23, 0.4-0.45, 0.62-0.67, 0.84-0.89
