; Sample 01, reference/01-nested-rings-acrylic-set.png: the nested-ring toy.
; Ring 1 fixed (180 teeth, inner). Rings 2 and 3 are a pair of eccentric
; annuli meshed together; their setting puts ring 3's bore off ring 2's
; centre. The rider (ring 4) rolls in that bore with the pen in a hole.
; The whole pair rolls round inside ring 1.
;
; Teeth read off the frame, scaled to the 180 band: carrier 144 outside,
; bore about 65, rider about 40. The bore offset is the pair's setting.
; How fast the rider goes round the bore against the carrier's trip round
; ring 1 is set by the hand, not the teeth: `cycles` on the rider.
[pipeline]
modules = rider, carrier

; ring 4 in ring 3's bore
[rider]
type = spirograph_gear
fixed_teeth = 65
rolling_teeth = 40
tooth_pitch = 1.0
hole_position = 0.8
inside = true
cycles = 5

; rings 2 + 3: the carrier, rolling in ring 1, its bore set off-centre
[carrier]
type = ring_carrier
fixed_teeth = 180
rolling_teeth = 144
tooth_pitch = 1.0
bore_offset = 6
inside = true
cycles = 1

[sampling]
initial_samples = 200000
output_samples = 20000

[output]
width = 800
height = 800
stroke_width = 0.6
stroke_color = #b01030
