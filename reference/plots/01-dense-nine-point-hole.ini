; nine-point with a hole: a 160-tooth carrier, 200 and a half loops a trip, two trips
[pipeline]
modules = rider, carrier

[rider]
type = spirograph_gear
fixed_teeth = 72
rolling_teeth = 48
hole_position = 0.85
cycles = 401

[carrier]
type = ring_carrier
fixed_teeth = 180
rolling_teeth = 160
bore_offset = 8
cycles = 2

[sampling]
initial_samples = 800000
output_samples = 120000

[output]
stroke_width = 0.15
stroke_color = #202020
