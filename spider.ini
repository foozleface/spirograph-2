[pipeline]
modules = s0, s1, s2, s3

[s0]
type = spirograph_gear
fixed_teeth = 105
rolling_teeth = 52
tooth_pitch = 7.9
hole_position = 0.65
inside = true
cycles = 20

[s1]
type = translation
start_x = 0
end_x = 208.3
start_y = 0
end_y = 0
normalize = true

[s2]
type = rotation
total_degrees = 540
origin_x = 0
origin_y = 0
normalize = true

[s3]
type = spiral_shape
start_radius = 5
end_radius = 139.28
turns = 4.34
cycles = 1

[output]
width = 800
height = 800
stroke_width = 0.12
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
scroll_repeats = 1
