[pipeline]
modules = s0, s1, s2

[s0]
type = harmonograph
freq1 = 2
amp1 = 100
end_amp1 = 100
phase1 = 0
decay1 = 0
freq2 = 3
amp2 = 100
end_amp2 = 100
phase2 = 90
decay2 = 0
freq3 = 0
amp3 = 0
end_amp3 = 0
phase3 = 0
decay3 = 0
duration = 60
cycles = 1

[s1]
type = rotation
total_degrees = 360
origin_x = 0
origin_y = 0
normalize = true

[s2]
type = stretch
scale_x = 2.9
end_scale_x = 1
scale_y = 1
end_scale_y = 1

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
scroll_repeats = 1
