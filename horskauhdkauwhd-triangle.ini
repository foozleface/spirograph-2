[pipeline]
modules = s0, s1, s2, s3

[s0]
type = lissajous
freq_x = 4
freq_y = 3
amplitude_x = 50.0
end_amplitude_x = 50.0
amplitude_y = 50.0
end_amplitude_y = 50.0
phase = 70.0
end_phase = 90.0
cycles = 92.0

[s1]
type = rotation
total_degrees = 360.0
origin_x = 0.0
origin_y = 0.0
normalize = true

[s2]
type = arc
radius = 100.0
start_angle = 0.0
sweep_angle = 180.0
cycles = 1.0
center_x = 0.0
center_y = 0.0
normalize = true

[s3]
type = rail_slide
rail_length = 200.0
passes = 2
rail_angle = 90.0
cycles = 1.0
scale = 1.0

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 120000
output_samples = 16000
use_arc_length = true
