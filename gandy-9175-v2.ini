; Version 2 of the Gandy replica: the oval's pivot slides 150 outward on the
; table over the turn, so the ovals' near sides trace his meta-spiral.
[pipeline]
modules = s0, s1, s2, s3

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 60
end_radius_x = 112
osc_radius_x = 13,0
jitter_radius_x = 9,17
radius_y = 33.6
end_radius_y = 56
osc_radius_y = 13,0
jitter_radius_y = 12,11
rotation = 0
end_rotation = 5
osc_rotation = 13,0
cycles = 420

[s1]
type = translation
start_x = 0
end_x = -150
start_y = 0
end_y = 0
normalize = true

[s2]
type = stretch
scale_x = 0.66
end_scale_x = 1.0
osc_scale_x = 1,0
scale_y = 1
end_scale_y = 1
origin_x = -2
origin_y = 0

[s3]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
