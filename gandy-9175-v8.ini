; Version 8 of the Gandy replica: the nested rings round the knot -- the
; meta-spiral -- come from the table standing still. Zoomed in, each ring of
; the original is a bundle of near-identical ovals, all pinned at the knot
; and pointing the same way, at four or five sizes: the pen was running
; before the table was, and the table was nudged round by hand a few times
; before its drive was switched on. So the oval's swell (13 times a turn,
; the petals) is geared to the table, not the pen: a Scale after a Tempo
; "motor" that is turned by hand in four nudges over the first sixth of the
; draw, then switched on. A second Scale, once over the turn, makes the
; petals big one side and small the other; the pivot slides a little and
; wanders on a small circle, which fills the knot into an eye.
; After James Nolan Gandy, "Drawing from Drawing Machine #9175":
; jamesnolangandy.com/drawings-for-sale-53/drawing-from-drawing-machine-9155
[pipeline]
modules = s0, s1, s2, s3, s4, s5, s6

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 130
jitter_radius_x = 6,17
radius_y = 105
jitter_radius_y = 8,11
rotation = 25
end_rotation = 29
cycles = 525

[s1]
type = tempo
mode = motor
on_at = 0.16
creep = 0.11
nudges = 4
spinup = 0.03

[s2]
type = scale
start_scale = 0.3
end_scale = 1.0
osc_start_scale = 16.25,0
jitter_start_scale = 5,17
origin_x = 0
origin_y = 0

[s3]
type = scale
start_scale = 1.0
end_scale = 0.55
osc_start_scale = 1,0
origin_x = 0
origin_y = 0

[s4]
type = translation
start_x = 0
end_x = -15
start_y = 0
end_y = -12
normalize = true

[s5]
type = circle
radius = 12
cycles = 2

[s6]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 150000
output_samples = 40000
use_arc_length = true
