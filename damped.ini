[pipeline]
modules = grp_0, s1

[grp0_b0_m0]
type = lissajous
freq_x = 3
freq_y = 2
amplitude_x = 94.3
end_amplitude_x = 27.9
amplitude_y = 130
end_amplitude_y = 26.5
phase = 90
end_phase = 90
cycles = 100

[grp0_b1_m0]
type = circle
radius = 50
end_radius = 50
cycles = 1

[grp_0]
type = group
modules = grp0_b0_m0 | grp0_b1_m0

[s1]
type = damping
decay_rate = 0.02
end_decay_rate = 0.02
duration = 60

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 1000000
output_samples = 100000
use_arc_length = true
scroll_repeats = 1
