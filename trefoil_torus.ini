[pipeline]
modules = path_circle, tube_circle

[path_circle]
type = circle
radius = 120
cycles = 1

[tube_circle]
type = circle
radius = 10
end_radius = 80
osc_radius = 3,0.5
cycles = 80

[sampling]
initial_samples = 500000
output_samples = 60000
use_arc_length = true

[output]
width = 800
height = 800
margin = 0.05
stroke_width = 0.08
stroke_color = #cc3366
background_color = #ffffff
