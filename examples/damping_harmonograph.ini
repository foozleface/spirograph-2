# Harmonograph with global damping — pattern decays toward center
[pipeline]
modules = harmonograph, damping

[output]
filename = damping_harmonograph.svg
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
margin = 0.1

[sampling]
initial_samples = 200000
output_samples = 50000

[harmonograph]
type = harmonograph
preset = rotary
cycles = 1
duration = 80.0
decay1 = 0
decay2 = 0
decay3 = 0

[damping]
type = damping
decay_rate = 0.03
duration = 50.0
