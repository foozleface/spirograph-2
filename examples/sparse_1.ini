[pipeline]
modules = s0, s1, s2

[s0]
type = lissajous
freq_x = 3
freq_y = 2
amplitude_x = 60
end_amplitude_x = 50
amplitude_y = 60
end_amplitude_y = 50
phase = 90
end_phase = 90
cycles = 15

[s1]
type = rotation
total_degrees = -180
origin_x = 0
origin_y = 0
normalize = true

[s2]
type = rotation
total_degrees = 90
origin_x = 30
origin_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
scroll_repeats = 1
