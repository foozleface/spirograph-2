[pipeline]
modules = s0, s1

[s0]
type = star_shape
points = 3
outer_radius = 50
end_outer_radius = 50
inner_radius = 10.1
end_inner_radius = 32.6
lobe = 0
lobe_n = 1
cycles = 400
rotation = -90
end_rotation = 11.2

[s1]
type = ellipse
radius_x = 50
end_radius_x = 50
radius_y = 30
end_radius_y = 30
rotation = 0
end_rotation = 0
lobe = 0
lobe_n = 1
cycles = 0.7

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 1000000
output_samples = 100000
use_arc_length = true
scroll_repeats = 1
