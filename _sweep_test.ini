[pipeline]
modules = s0, s1

[s0]
type = circle
radius = 40
sweep = 25
sweep_n = 3
cycles = 80

[s1]
type = spiral_arc
inner_radius = 20
outer_radius = 180
sweep_angle = 1080
start_angle = 0

[output]
width = 800
height = 800
stroke_width = 0.1
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
