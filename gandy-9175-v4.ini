; Version 4 of the Gandy replica: v3 with a longer slide (130, 100) and the
; table turning 1.25 times -- a wider meta-spiral and more overlapping petals.
[pipeline]
modules = s0, s1, s2

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 72
end_radius_x = 134.4
osc_radius_x = 16.25,0
jitter_radius_x = 9,17
radius_y = 50.4
end_radius_y = 84
osc_radius_y = 16.25,0
jitter_radius_y = 12,11
rotation = 0
end_rotation = 4
osc_rotation = 16.25,0
cycles = 525

[s1]
type = translation
start_x = 0
end_x = -130
start_y = 0
end_y = -100
normalize = true
easing = ease_in

[s2]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
