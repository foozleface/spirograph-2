# surface(klein) + rotation + translation + damping. Double density.
[pipeline]
modules = surf, rot, translation, damping

[output]
filename = claude_autogen/star_vortex.svg
width = 800
height = 800
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[surf]
type = surface
surface = klein
major_radius = 180.0
minor_radius = 60.0
u_min = 0.0
u_max = 6.283185
v_min = 0.0
v_max = 6.283185
v_lines = 80
view_angle_x = 30.0
view_angle_y = 45.0
view_angle_z = 15.0

[rot]
type = rotation
total_degrees = 30.0

[translation]
type = translation
start_x = -50.0
start_y = 0.0
end_x = 50.0
end_y = 0.0

[damping]
type = damping
decay_rate = 0.008
duration = 80.0
origin_x = 0.0
origin_y = 0.0
