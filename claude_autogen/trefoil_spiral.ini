# spirograph_gear + arc + noise + scale + translation + damping. More density.
[pipeline]
modules = gear, arc, noise, scale, translation, damping

[output]
filename = claude_autogen/trefoil_spiral.svg
width = 1600
height = 600
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[gear]
type = spirograph_gear
fixed_teeth = 105
rolling_teeth = 42
tooth_pitch = 7.0
hole_position = 0.65
inside = true
cycles = 90

[arc]
type = arc
radius = 220.0
start_angle = 0.0
sweep_angle = 270.0
center_x = 0.0
center_y = 0.0
cycles = 1

[noise]
type = noise
amplitude = 20.0
frequency = 2.5
seed = 31
mode = radial

[scale]
type = scale
start_scale = 0.5
end_scale = 1.3
origin_x = 0.0
origin_y = 0.0

[translation]
type = translation
start_x = -300.0
start_y = 0.0
end_x = 300.0
end_y = 0.0

[damping]
type = damping
decay_rate = 0.015
duration = 50.0
origin_x = 0.0
origin_y = 0.0
