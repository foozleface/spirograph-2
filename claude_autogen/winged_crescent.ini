# Winged crescent — spirograph gear with visible star lobes
# translated and spiraled into a dense feathered crescent.
[pipeline]
modules = gear, arc, translation, rotation, spiral_shape, bend

[output]
filename = claude_autogen/winged_crescent.svg
width = 1600
height = 600
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[gear]
type = spirograph_gear
fixed_teeth = 105
rolling_teeth = 52
tooth_pitch = 9.0
hole_position = 0.60
inside = true
cycles = 15

[arc]
type = arc
start_angle = 0.0
sweep_angle = 90.0
cycles = 1

[translation]
type = translation
start_x = 0.0
start_y = 0.0
end_x = 900
end_y = 0.0

[rotation]
type = rotation
total_degrees = 80.0

[spiral_shape]
type = spiral_shape
start_radius = 5.0
end_radius = 140.0
turns = 4.5

[bend]
type = bend
radius = 200.0
start_angle = 0.0
sweep_angle = 200.0
center_x = 0.0
center_y = 0.0
direction = 1
