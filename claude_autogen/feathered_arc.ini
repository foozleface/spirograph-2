# Random 9 — harmonograph(5:3 damped) + scale + rotation.
# Complex multi-lobed Lissajous with scaling and spin. Square.
[pipeline]
modules = harm, scale, rotation

[output]
filename = claude_autogen/feathered_arc.svg
width = 800
height = 800
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[harm]
type = harmonograph
preset =
freq1 = 5.0
amp1 = 190.0
phase1 = 0.0
decay1 = 0.015
freq2 = 3.0
amp2 = 150.0
phase2 = 30.0
decay2 = 0.018
freq3 = 0.0
amp3 = 0.0
phase3 = 0.0
decay3 = 0.0
freq4 = 0.0
amp4 = 0.0
phase4 = 0.0
decay4 = 0.0
duration = 100.0

[scale]
type = scale
start_scale = 1.0
end_scale = 0.5
origin_x = 0.0
origin_y = 0.0

[rotation]
type = rotation
total_degrees = 90.0
