[pipeline]
modules = s0, s1, s2, s3, s4

[s0]
type = ellipse
radius_x = 160
end_radius_x = 31.9
radius_y = 100
end_radius_y = 21.8
rotation = 0
end_rotation = 0
cycles = 600

[s1]
type = rotation
total_degrees = 540
origin_x = 0
origin_y = 0
normalize = true

[s2]
type = translation
start_x = 0
end_x = 1000
start_y = 0
end_y = 0
normalize = true

[s3]
type = spiral_shape
start_radius = 5
end_radius = 170
turns = 6
cycles = 1

[s4]
type = bend
radius = 200
start_angle = 0
sweep_angle = 120
center_x = 0
center_y = 0
direction = 1

[output]
width = 800
height = 800
stroke_width = 0.15
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
scroll_repeats = 1
