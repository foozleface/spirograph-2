# surface(figure8) + damping. Triple density.
[pipeline]
modules = surf, damping

[output]
filename = claude_autogen/harmonic_ribbon.svg
width = 800
height = 800
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[surf]
type = surface
surface = figure8
major_radius = 180.0
minor_radius = 60.0
u_min = 0.0
u_max = 6.283185
v_min = 0.0
v_max = 6.283185
v_lines = 105
view_angle_x = 40.0
view_angle_y = 30.0
view_angle_z = 15.0

[damping]
type = damping
decay_rate = 0.01
duration = 60.0
origin_x = 0.0
origin_y = 0.0
