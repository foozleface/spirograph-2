# Vortex shell — spirograph with distinct visible lobes, translated
# along a spiral path and bent into a nautilus form.
[pipeline]
modules = gear, arc, translation, rotation, spiral_shape, bend

[output]
filename = claude_autogen/vortex_shell.svg
width = 1600
height = 600
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[gear]
type = spirograph_gear
fixed_teeth = 105
rolling_teeth = 52
tooth_pitch = 11.0
hole_position = 0.62
inside = true
cycles = 10

[arc]
type = arc
start_angle = 0.0
sweep_angle = 80.0
cycles = 1

[translation]
type = translation
start_x = 0.0
start_y = 0.0
end_x = 1100
end_y = 0.0

[rotation]
type = rotation
total_degrees = 110.0
origin_x = 0.0
origin_y = 0.0

[spiral_shape]
type = spiral_shape
start_radius = 5.0
end_radius = 160.0
turns = 4.5

[bend]
type = bend
radius = 220.0
start_angle = 0.0
sweep_angle = 230.0
center_x = 0.0
center_y = 0.0
direction = 1
