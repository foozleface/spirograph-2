# Hypnotic vortex — gear shrinking inward with accelerating rotation.
# Dense at edges, sparse at center. Draws the eye inward.
[pipeline]
modules = gear, damping_inward, spin

[output]
filename = hypnotic_vortex.svg
width = 800
height = 800
stroke_width = 0.15
stroke_color = #000000
margin = 0.06

[sampling]
initial_samples = 400000
output_samples = 80000
scroll_repeats = 6.0

[gear]
type = spirograph_gear
fixed_teeth = 84
rolling_teeth = 32
tooth_pitch = 2.0
hole_position = 0.65
inside = true

[damping_inward]
type = damping
decay_rate = 0.025
duration = 60.0
normalize = false

[spin]
type = rotation
total_degrees = 2160
normalize = false
easing = ease_in
