# Random 1 iter3 — Complete rewrite. Ellipse + bend + rotation + damping.
# Ellipses warped by bend with rotation and decay. Square format.
[pipeline]
modules = ell, bend, rotation, damping

[output]
filename = claude_autogen/petal_fan.svg
width = 800
height = 800
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[ell]
type = ellipse
radius_x = 200.0
radius_y = 120.0
end_radius_x = 60.0
end_radius_y = 40.0
cycles = 80
rotation = 0.0

[bend]
type = bend
radius = 280.0
start_angle = 0.0
sweep_angle = 240.0
center_x = 0.0
center_y = 0.0
direction = 1

[rotation]
type = rotation
total_degrees = 180.0

[damping]
type = damping
decay_rate = 0.03
duration = 30.0
origin_x = 0.0
origin_y = 0.0
