[pipeline]
modules = s0, s1

[s0]
type = ellipse
radius_x = 119.72
radius_y = 60.68
end_radius_x = 51.6
end_radius_y = 36.91
cycles = 90
rotation = 3.16

[s1]
type = rotation
total_degrees = 360
origin_x = 0
origin_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.1
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
scroll_repeats = 1

[symmetry]
n_fold = 4
mirror = False
