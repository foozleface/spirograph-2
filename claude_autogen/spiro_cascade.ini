# Spiro cascade — spirograph with visible triangular star forms
# cascading along a spiral path. Like verical.ini from joe_fun.
[pipeline]
modules = gear, arc, translation, rotation, spiral_shape

[output]
filename = claude_autogen/spiro_cascade.svg
width = 1600
height = 600
stroke_width = 0.15
stroke_color = #000000
margin = 0.08

[sampling]
initial_samples = 400000
output_samples = 400000

[gear]
type = spirograph_gear
fixed_teeth = 105
rolling_teeth = 52
tooth_pitch = 7.5
hole_position = 0.65
inside = true
cycles = 17

[arc]
type = arc
start_angle = 0.0
sweep_angle = 80.0
cycles = 1

[translation]
type = translation
start_x = 0.0
start_y = 0.0
end_x = 1100
end_y = 0.0

[rotation]
type = rotation
total_degrees = 100.0

[spiral_shape]
type = spiral_shape
start_radius = 5.0
end_radius = 180.0
turns = 5.0
