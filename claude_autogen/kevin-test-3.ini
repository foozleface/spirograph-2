[pipeline]
modules = s0, s1, s2, s3

[s0]
type = ellipse
radius_x = 119.72
end_radius_x = 5
radius_y = 60.68
end_radius_y = 5
rotation = 3.16
end_rotation = 0
lobe = 0
lobe_n = 1
cycles = 138

[s1]
type = rotation
total_degrees = 360
origin_x = 0
origin_y = 0
normalize = true

[s2]
type = stretch
scale_x = 2.3
end_scale_x = 1
scale_y = 1
end_scale_y = 1

[s3]
type = translation
start_x = 0
end_x = 100
start_y = 0
end_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.1
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
scroll_repeats = 1

[symmetry]
n_fold = 4
mirror = False
