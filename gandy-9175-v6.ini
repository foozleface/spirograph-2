; Version 6 of the Gandy replica: v5 with the oval aimed 40 degrees past the
; table axis instead of through it. Measured against the photo it is closer on
; the knot position, the centre density and the ring, but it reads as a
; nautilus rather than a fan of petals; kept for comparison.
; Version 5 of the Gandy replica: as v4, but the oval starts offset from the
; table centre (50, 40 out) and slides to (150, 115) -- it never sits on the
; axis, so the knot is a cross-hatched eye rather than a point.
[pipeline]
modules = s0, s1, s2

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 72
end_radius_x = 134.4
osc_radius_x = 16.25,0
jitter_radius_x = 9,17
radius_y = 50.4
end_radius_y = 84
osc_radius_y = 16.25,0
jitter_radius_y = 12,11
rotation = 40
end_rotation = 44
osc_rotation = 16.25,0
cycles = 525

[s1]
type = translation
start_x = -50
end_x = -150
start_y = -40
end_y = -115
normalize = true
easing = ease_in

[s2]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
