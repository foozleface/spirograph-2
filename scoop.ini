[pipeline]
modules = s0, s1, s2

[s0]
type = ellipse
radius_x = 158.23
radius_y = 30.15
end_radius_x = 30.15
end_radius_y = 158.23
cycles = 105
rotation = 20.25

[s1]
type = damping
decay_rate = 0.01
duration = 58.36

[s2]
type = rotation
total_degrees = 180
origin_x = 0
origin_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.12
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
scroll_repeats = 1
