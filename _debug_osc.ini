[pipeline]
modules = s0, s1

[s0]
type = circle
radius = 50
end_radius = 105
osc_radius = 13,0.8
cycles = 50

[s1]
type = arc
arc_radius = 200
sweep_angle = 270
start_angle = 0
cycles = 1

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
