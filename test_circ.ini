[pipeline]
modules = s0, s1

[s0]
type = circle
radius = 19.9
end_radius = 50
sweep = 3
sweep_n = 1.5
cycles = 300

[s1]
type = circle
radius = 50
end_radius = 50
sweep = 0
sweep_n = 1
cycles = 0.6

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 80000
output_samples = 12000
use_arc_length = true
scroll_repeats = 1
