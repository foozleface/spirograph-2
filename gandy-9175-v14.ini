; Version 14 of the Gandy replica: the operator, not just the machine.
; Thirteen separate runs of loops, the table turned by hand 27.7 degrees
; between them with the pen off the paper, instead of one run over a
; table geared at 13.007 loops a turn. Each run is one swell, small to
; large to small, over 32 loops; before them a ring run of 5 held sizes
; with the table nudged a little between sizes. The line is cut wherever
; the pen jumped. Sampled in time, not arc length, so a jump stays a
; single long step for the pen lift to find.
; After James Nolan Gandy, "Drawing from Drawing Machine #9175":
; jamesnolangandy.com/drawings-for-sale-53/drawing-from-drawing-machine-9155
[pipeline]
modules = so, s0, sh, s3, tb, s2, ti, s6

; where the pen rests: this far from the table's axis
[so]
type = translation
start_x = 45
end_x = 45
start_y = 0
end_y = 0
normalize = true

; the loop; its tilt nudged four times during the ring run (the table by hand)
[s0]
type = ellipse
anchor = end
center_x = 0
radius_x = 150
radius_y = 130
rotation = 15
switch_rotation = 0.0323 18.75, 0.0645 22.50, 0.0968 26.25, 0.1290 30.00
cycles = 496

; the pin's slot: the ring run's held sizes, relative to the swell's small end
[sh]
type = scale
scope = 1
start_scale = 0.400
end_scale = 0.400
switch_start_scale = 0.0323 0.733, 0.0645 1.167, 0.0968 1.667, 0.1290 2.167, 0.1613 1.0
origin_x = 0
origin_y = 0

[s3]
type = scale
scope = 1
start_scale = 1.0
end_scale = 0.5
osc_start_scale = 1,0,0.08
origin_x = 0
origin_y = 0

; the runs' clock: still through the ring run, then the thirteen runs
[tb]
type = tempo
mode = motor
on_at = 0.1613
creep = 0
spinup = 0

; one swell per run
[s2]
type = scale
scope = 1
start_scale = 0.3
end_scale = 1.0
osc_start_scale = 13,0
origin_x = 0
origin_y = 0

; the table, turned by hand between runs
[ti]
type = tempo
mode = stutter
steps = 13
dwell = 1

[s6]
type = rotation
total_degrees = 360

[pen_lift]
mode = threshold
threshold = 40

[output]
width = 800
height = 800
stroke_width = 0.25
stroke_color = #000000
background_color = #ffffff
margin = 0.08
ink_flow = 0.5
filename = /dev/null

[sampling]
initial_samples = 150000
output_samples = 40000
use_arc_length = false
