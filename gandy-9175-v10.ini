; Version 10 of the Gandy replica: version 9 rebuilt from the knobs his
; machine actually has (see pintograph.py and the tempo's motor). The ring
; stack is the pin moved out along its slot between four held runs, the
; table nudged by hand each time with the drive belt off -- so the rings
; fan the 15 degrees the photo shows without the loop size being geared to
; the table while he does it. Then the belt goes on: the swell runs 13
; times a table turn and starts from the size of the last ring. The line
; is weighted by how slowly the pen moved, as a gravity-fed pen's is.
; After James Nolan Gandy, "Drawing from Drawing Machine #9175":
; jamesnolangandy.com/drawings-for-sale-53/drawing-from-drawing-machine-9155
[pipeline]
modules = s0, sh, ta, s3, s4, s5, s6, tb, s2

[s0]
type = ellipse
anchor = end
center_x = -2
radius_x = 130
jitter_radius_x = 6,17
radius_y = 115
jitter_radius_y = 8,11
rotation = 36
end_rotation = 40
cycles = 525

; the pin's slot: four held loop sizes, then out to full for the run
; (sizes relative to the swell, which creeps up a little through the holds
; and so spreads each ring into a band)
[sh]
type = scale
start_scale = 0.28
end_scale = 0.28
switch_start_scale = 0.04 0.47, 0.08 0.67, 0.12 0.86, 0.16 1.0
origin_x = 0
origin_y = 0

; the table: nudged by hand three times while the rings are drawn, then
; the motor switched on
[ta]
type = tempo
mode = motor
on_at = 0.2
creep = 0.167
nudges = 4
spinup = 0.03

[s3]
type = scale
start_scale = 1.0
end_scale = 0.5
osc_start_scale = 1,0,0.08
origin_x = 0
origin_y = 0

[s4]
type = translation
start_x = 0
end_x = -15
start_y = 0
end_y = -12
normalize = true

[s5]
type = circle
radius = 18
cycles = 2

[s6]
type = rotation
loops_per_turn = 420
slip = 3
slip_wanders = 5

; the swell's belt goes on only when the motor does
[tb]
type = tempo
mode = motor
on_at = 0.04
creep = 0.12
spinup = 0

[s2]
type = scale
start_scale = 0.3
end_scale = 1.0
osc_start_scale = 15.6,0,0.15
jitter_start_scale = 5,17
origin_x = 0
origin_y = 0

[output]
width = 800
height = 800
stroke_width = 0.25
stroke_color = #000000
background_color = #ffffff
margin = 0.08
ink_flow = 0.5
filename = /dev/null

[sampling]
initial_samples = 150000
output_samples = 40000
use_arc_length = true
