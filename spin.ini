[pipeline]
modules = s0, s1, s2

[s0]
type = ellipse
radius_x = 198.84
radius_y = 37.2
end_radius_x = 37.2
end_radius_y = 198.84
cycles = 115
rotation = 18.12

[s1]
type = damping
decay_rate = 0.02
duration = 45.18

[s2]
type = rotation
total_degrees = 120
origin_x = 0
origin_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.12
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
scroll_repeats = 1
