[pipeline]
modules = s0, s1, s2

[s0]
type = surface
surface = klein
major_radius = 112.35
minor_radius = 31.55
v_lines = 183
view_angle_x = 39.33
view_angle_y = 24.46

[s1]
type = rotation
total_degrees = 360
origin_x = 0
origin_y = 0
normalize = true

[s2]
type = arc
radius = 100
start_angle = 0
sweep_angle = 180
cycles = 1
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.1
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
scroll_repeats = 1
