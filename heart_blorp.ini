[pipeline]
modules = grp_0, s1

[grp0_b0_m0]
type = surface
surface = torus
major_radius = 100
minor_radius = 40
width = 60
twists = 0
v_lines = 163
view_angle_x = 69.4
view_angle_y = 0
view_angle_z = -71.2
scale = 1
cycles = 3

[grp0_b1_m0]
type = arc
radius = 100
start_angle = 0
sweep_angle = 180
cycles = 3
normalize = true

[grp_0]
type = group
modules = grp0_b0_m0 | grp0_b1_m0

[s1]
type = rotation
total_degrees = 360
origin_x = 0
origin_y = 0
normalize = true

[output]
width = 800
height = 800
stroke_width = 0.3
stroke_color = #000000
background_color = #ffffff
margin = 0.08
filename = /dev/null

[sampling]
initial_samples = 300000
output_samples = 40000
use_arc_length = true
scroll_repeats = 1
